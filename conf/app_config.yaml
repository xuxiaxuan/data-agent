logging:
  file: # 日志输出到日志文件
    enable: true
    level: INFO
    path: logs # 路径
    rotation: "10 MB" # 日志文件截断大小
    retention: "7 days" # 日志保留时长
  console: # 日志输出到控制台
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: root
  password: ${env:DB_META_PASSWORD}
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: root
  password: ${env:DB_DW_PASSWORD}
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5


es:
  host: localhost
  port: 9200
  index_name: data_agent


llm:
  model_name: qwen2.5:3b
  api_key: ${env:LLM_API_KEY} # ollama本地无需密钥，留空即可
  base_url: http://localhost:11434